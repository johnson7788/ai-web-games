<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROCKET DERBY</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="stage">

    <div id="hud" class="hidden">
      <div id="fx-layer"></div>
      <div class="hud-box" id="hud-score-box">
        <span class="hud-label" data-i18n="score">SCORE</span>
        <div class="score-line"><b id="hud-score-p">0</b><span>:</span><b id="hud-score-o" class="opp">0</b></div>
      </div>
      <div class="hud-box" id="hud-time-box">
        <span class="hud-label" data-i18n="time">TIME</span>
        <b id="hud-clock">2:00</b>
      </div>
      <div class="hud-box" id="hud-level-box">
        <span class="hud-label" data-i18n="level">LEVEL</span>
        <b id="hud-level">MATCH 1/5</b>
      </div>
      <div class="hud-box" id="hud-bars-box">
        <div class="bar-row"><span class="hud-label" data-i18n="boost">BOOST</span>
          <div class="bar"><div id="hud-boost-fill"></div></div></div>
      </div>
    </div>

    <div id="screen-title" class="screen">
      <div id="title-inner">
        <h1 id="title-text">ROCKET DERBY</h1>
        <p id="subtitle-text"></p>
        <div id="title-stats">
          <div class="title-stat"><span class="hud-label" data-i18n="bestGoal">FASTEST GOAL</span><b id="title-best">0</b></div>
          <div class="title-stat"><span class="hud-label" data-i18n="wins">WINS</span><b id="title-wins">0</b></div>
        </div>
        <div id="title-buttons">
          <button id="btn-start" class="btn primary"></button>
          <button id="btn-howto" class="btn" data-tutorial-replay></button>
        </div>
        <div id="title-meta">
          <select id="lang-select" aria-label="Language"></select>
          <button id="btn-mute" class="btn small"></button>
        </div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">PAUSED</h2>
      <button id="btn-resume" class="btn primary"></button>
      <button id="btn-restart-pause" class="btn"></button>
      <button id="btn-menu-pause" class="btn"></button>
      <select id="lang-select-pause" aria-label="Language"></select>
    </div>

    <div id="screen-results" class="screen hidden">
      <h2 id="res-title"></h2>
      <p id="res-sub"></p>
      <div id="res-rating" class="rank-C">C</div>
      <div id="res-stats"></div>
      <div id="results-buttons">
        <button id="btn-res-primary" class="btn primary"></button>
        <button id="btn-share" class="btn"></button>
        <button id="btn-menu-res" class="btn"></button>
      </div>
    </div>

    <div id="tutorial" data-tutorial class="hidden">
      <div id="tut-highlight"></div>
      <div id="tut-card">
        <div id="tut-dots"></div>
        <p id="tut-text"></p>
        <div id="tut-buttons">
          <button id="tut-next" class="btn primary"></button>
          <button id="tut-skip" class="btn" data-tutorial-skip></button>
        </div>
      </div>
    </div>

    <div id="rotate" class="hidden">
      <div id="rotate-card">
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" class="btn small"></button>
      </div>
    </div>

    <div id="touch" class="hidden">
      <button class="steer" data-steer="-1" aria-label="steer left"></button>
      <button class="steer" data-steer="1" aria-label="steer right"></button>
      <button id="btn-boost" class="touch-action"></button>
      <button id="btn-jump" class="touch-action"></button>
      <button id="btn-throttle" class="touch-action"></button>
    </div>

  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
