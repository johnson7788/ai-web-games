<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNOWMAN FACTORY</title>
  <link rel="stylesheet" href="styles.css?v=snf1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="screen-title" class="screen">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">SNOWMAN FACTORY</h1>
      <p id="subtitle-text"></p>
      <p id="tagline-text"></p>
      <button id="btn-start">PLAY</button>
      <button id="btn-crazy">CRAZY</button>
      <button id="btn-howto" data-tutorial-replay>How to play</button>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-level"></span>
          <span id="hud-score"></span>
          <span id="hud-goal" class="hud-pill hud-goal"></span>
          <span id="hud-combo" class="hud-pill"></span>
          <span id="hud-time" class="hud-pill"></span>
        </div>
        <div class="hud-right">
          <span id="hud-lives"></span>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-howto-hud" class="hud-btn" data-tutorial-replay aria-label="How to play">?</button>
          <button id="btn-pause" class="hud-btn" aria-label="Pause"></button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart"></button>
        </div>
      </div>
    </div>

    <button id="btn-drop" class="hidden">DROP</button>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2">Restart</button>
      <button id="btn-howto-pause" class="btn-ghost" data-tutorial-replay>How to play</button>
      <button id="btn-home" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title"></h2>
      <div id="result-reason"></div>
      <div id="result-score"></div>
      <div id="result-best"></div>
      <div class="btn-row">
        <button id="btn-retry">Retry</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a better view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=snf1"></script>
</body>
</html>
