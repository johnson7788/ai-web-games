<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MAHJONG SOLITAIRE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-remaining"></span>
        <span id="hud-pairs"></span>
        <span id="hud-time"></span>
      </div>
      <div class="hud-right">
        <button id="btn-hint" class="hud-btn"></button>
        <button id="btn-undo" class="hud-btn"></button>
        <button id="btn-shuffle" class="hud-btn"></button>
        <button id="btn-mute" class="hud-btn"></button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-win" class="screen hidden">
      <h2 id="win-title"></h2>
      <p class="win-time" id="win-time"></p>
      <div class="win-stars" id="win-stars"></div>
      <button id="btn-again"></button>
      <button id="btn-title" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
