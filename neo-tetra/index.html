<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="NEO TETRA — drop element crystals into a neon furnace, smelt lines, chain heat and trigger white-hot eruptions.">
  <meta name="theme-color" content="#180a02">
  <title>NEO TETRA · Neon Furnace Tetris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="touch-bar" class="touch-only" aria-hidden="true">
      <button id="btn-t-left" class="tbtn" type="button">◀</button>
      <button id="btn-t-right" class="tbtn" type="button">▶</button>
      <button id="btn-t-soft" class="tbtn" type="button">▼</button>
      <button id="btn-t-rotate" class="tbtn" type="button">⟳</button>
      <button id="btn-t-hold" class="tbtn" type="button">HOLD</button>
      <button id="btn-t-drop" class="tbtn tbtn-primary" type="button">DROP</button>
    </div>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Charging the furnace…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
