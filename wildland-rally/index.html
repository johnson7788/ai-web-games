<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WILDLAND RALLY</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-wave" class="hud-pill"></span>
          <span id="hud-score" class="hud-pill"></span>
          <span id="hud-combo" class="hud-pill hidden"></span>
        </div>
        <div class="hud-right">
          <span id="hud-targets" class="hud-pill hud-targets"></span>
          <span id="hud-hp" class="hud-pill"></span>
          <span id="hud-lv" class="hud-pill"></span>
          <button id="btn-howto-hud" class="hud-btn" aria-label="Replay guide">?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">⟳</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">⌂</button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <div class="title-glow"></div>
      <h1 id="title-text">WILDLAND RALLY</h1>
      <p class="subtitle" id="subtitle-text">NEON WASTELAND ARENA</p>
      <div class="total-best"><span id="best-text"></span></div>
      <button id="btn-start">Start</button>
      <button id="btn-howto" class="btn-ghost" data-tutorial-replay>?</button>
      <div class="hint-line"><span id="move-hint"></span> · <span id="dash-hint"></span> · <span id="nova-hint"></span></div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost" data-tutorial-replay>How to play</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="screen-howto" class="screen hidden">
      <h2 id="howto-title"></h2>
      <p id="howto-body"></p>
      <button id="btn-howto-close">Close</button>
    </div>

    <div id="controls" class="hidden">
      <div class="ctrl-left">
        <div id="joystick" aria-label="Move"><div id="joy-knob"></div></div>
      </div>
      <div class="ctrl-right">
        <button id="btn-dash" class="pad-btn" aria-label="Dash"><span id="dash-label">DASH</span></button>
        <button id="btn-nova" class="pad-btn pad-nova" aria-label="Nova"><span id="nova-label">NOVA</span></button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger arena</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
