<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY PLANET GROW</title>
  <link rel="stylesheet" href="styles.css?v=mpg1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-goal" class="hud-goal"></span>
          <span class="hud-item"><span class="hud-label" data-label="score">Score</span><span id="hud-score">0</span></span>
          <span class="hud-item"><span class="hud-label" data-label="best">Best</span><span id="hud-best">0</span></span>
          <span class="hud-item"><span class="hud-label" data-label="mass">Mass</span><span id="hud-mass">0</span></span>
          <span class="hud-item" id="hud-tier"><span class="hud-label" data-label="tier">Tier</span><span id="hud-tier-num">1</span></span>
          <span class="hud-item"><span id="hud-hp" class="hp">♥♥♥</span></span>
          <span class="hud-item"><span id="hud-shield" class="shield"></span></span>
          <span class="hud-item"><span id="hud-combo" class="combo"></span></span>
        </div>
        <div class="hud-right">
          <button id="btn-mute" class="hud-btn" aria-label="Mute">🔊</button>
          <button id="btn-howto" class="hud-btn" data-tutorial-replay aria-label="How to play">?</button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">☰</button>
        </div>
      </div>
      <div class="tier-bar"><div id="hud-tier-fill"></div></div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">MY PLANET GROW</h1>
      <p class="subtitle" id="subtitle-text">Grow your planet, dodge the void</p>
      <p class="goal" id="goal-text">Grow as big as you can</p>
      <button id="btn-start">Start</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost">How to play</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Planet Collapsed</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="result-meta">
        <p id="result-score">Score: 0</p>
        <p id="result-best">Best: 0</p>
        <p id="result-mass">Mass: 0</p>
        <p id="result-newbest" class="newbest hidden">New best!</p>
      </div>
      <div class="win-btns">
        <button id="btn-retry">Grow again</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=mpg1"></script>
</body>
</html>
