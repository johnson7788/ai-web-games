<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DUO QUIZ</title>
  <meta name="description" content="A two-player same-screen quiz battle. Answer fast, score more, and beat your friend across 10 rounds.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left"><span id="round-label" class="round-label"></span></div>
      <div class="hud-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="play-area" class="hidden">
      <div id="question-text" class="question-text"></div>
      <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
      <div class="players">
        <div class="player p1">
          <img id="p1-mascot" class="mascot" alt="" draggable="false">
          <div id="p1-score" class="player-score"></div>
          <div id="p1-options" class="options"></div>
        </div>
        <div class="player p2">
          <img id="p2-mascot" class="mascot" alt="" draggable="false">
          <div id="p2-score" class="player-score"></div>
          <div id="p2-options" class="options"></div>
        </div>
      </div>
      <div id="reveal-bar" class="reveal-bar hidden">
        <span id="reveal-info"></span>
        <button id="btn-next" class="next-btn"></button>
      </div>
    </div>

    <div id="screen-title" class="screen hidden">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-done" class="screen hidden">
      <h2 id="done-title"></h2>
      <p class="done-scores" id="done-scores"></p>
      <button id="btn-again"></button>
      <button id="btn-title" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
