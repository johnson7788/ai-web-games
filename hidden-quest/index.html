<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HIDDEN QUEST</title>
  <meta name="description" content="Find the hidden objects scattered in a cluttered scene. Sharp eyes, hints, and endless levels.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-level" class="hud-level"></span>
        <span id="hud-score"></span>
        <span id="hud-found"></span>
      </div>
      <div class="hud-right">
        <button id="btn-hint" class="hud-btn"></button>
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="target-panel" class="hidden">
      <div id="find-label" class="find-label"></div>
      <div id="target-list" class="target-list"></div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-clear" class="screen hidden">
      <h2 id="clear-title"></h2>
      <p class="clear-score" id="clear-score"></p>
      <button id="btn-next"></button>
      <button id="btn-title" class="secondary"></button>
    </div>
  </div>

  <div id="loading" aria-hidden="true">
    <div class="loading-box">
      <div class="loading-bar"><div id="loading-fill"></div></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
