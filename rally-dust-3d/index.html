<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RALLY DUST 3D</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="stage">

    <div id="hud" class="hidden">
      <div class="hud-box" id="hud-speed-box">
        <b id="hud-speed">0</b><span class="hud-label" data-i18n="kmh">km/h</span>
        <span id="hud-gear" class="gear">1</span>
      </div>
      <div class="hud-box" id="hud-stage-box">
        <span class="hud-label" data-i18n="stage">STAGE</span>
        <b id="hud-stage">1/5</b>
        <span id="hud-time">0:00</span>
      </div>
      <div class="hud-box" id="hud-score-box">
        <span class="hud-label" data-i18n="drift">DRIFT</span>
        <b id="hud-score">0</b>
      </div>
      <div class="hud-box" id="hud-damage-box">
        <span class="hud-label" data-i18n="damage">DAMAGE</span>
        <div class="bar"><div id="hud-damage-fill"></div></div>
      </div>
      <div id="hud-pace-box">
        <span class="hud-label" data-i18n="paceNote">PACE NOTE</span>
        <b id="hud-pace-text">—</b>
      </div>
      <div id="hud-controls">
        <span class="chip" id="chip-throttle">W</span>
        <span class="chip" id="chip-steer">A/D</span>
        <span class="chip" id="chip-drift">SPACE</span>
        <span class="chip" id="chip-camera">C</span>
      </div>
      <div id="stagecard" class="hidden"><h2 id="stagecard-name"></h2><p id="stagecard-goal"></p></div>
      <div id="popups"></div>
    </div>

    <div id="screen-title" class="screen">
      <h1 id="title-text">RALLY DUST 3D</h1>
      <p id="subtitle-text"></p>
      <div id="title-best-wrap"><span class="hud-label" data-i18n="best">BEST</span> <b id="title-best">0</b></div>
      <div id="title-hints"></div>
      <div id="title-buttons">
        <button id="btn-start" class="btn primary"></button>
        <button id="btn-howto" class="btn" data-tutorial-replay></button>
      </div>
      <div id="title-meta">
        <select id="lang-select" aria-label="Language"></select>
        <button id="btn-mute" class="btn small"></button>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume" class="btn primary"></button>
      <button id="btn-restart-pause" class="btn"></button>
      <button id="btn-menu-pause" class="btn"></button>
      <select id="lang-select-pause" aria-label="Language"></select>
    </div>

    <div id="screen-results" class="screen hidden">
      <h2 id="res-title"></h2>
      <p id="res-sub"></p>
      <div id="res-rating"></div>
      <div id="res-score-wrap"><span class="hud-label" data-i18n="score">SCORE</span> <b id="res-score">0</b></div>
      <div id="res-best-wrap"><span class="hud-label" data-i18n="best">BEST</span> <b id="res-best">0</b></div>
      <div id="res-record" class="hidden"></div>
      <div id="res-stats"></div>
      <div id="results-buttons">
        <button id="btn-restart" class="btn primary"></button>
        <button id="btn-share" class="btn"></button>
        <button id="btn-menu" class="btn"></button>
      </div>
    </div>

    <div id="tutorial" data-tutorial class="hidden">
      <div id="tut-highlight"></div>
      <div id="tut-card">
        <div id="tut-dots"></div>
        <p id="tut-text"></p>
        <div id="tut-buttons">
          <button id="tut-next" class="btn primary"></button>
          <button id="tut-skip" class="btn" data-tutorial-skip></button>
        </div>
      </div>
    </div>

    <div id="rotate" class="hidden">
      <div id="rotate-card"><p id="rotate-text"></p><button id="btn-rotate-skip" class="btn small"></button></div>
    </div>

    <div id="touch" class="hidden">
      <div id="steer-zone">
        <div id="steer-slider"><div id="steer-knob"></div></div>
        <span class="touch-label" data-i18n="steerLabel">STEER</span>
      </div>
      <div id="touch-pedals">
        <button id="btn-brake" class="touch-action"></button>
        <button id="btn-throttle" class="touch-action"></button>
        <button id="btn-handbrake" class="touch-action"></button>
      </div>
    </div>

  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
