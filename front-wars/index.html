<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FRONT WARS</title>
  <meta name="description" content="A fast 4v4 top-down arena shooter. Pick a class, hold the line, and win three rounds against bot squads.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <div id="scene-shade" aria-hidden="true"></div>

    <div id="hud" class="hidden">
      <div class="scoreboard">
        <div class="team-score blue">
          <small>BLUE</small>
          <b id="score-blue">0</b>
          <div id="pips-blue" class="pips blue"></div>
        </div>
        <div class="match-clock">
          <div id="round-label">ROUND 1</div>
          <div id="clock">2:00</div>
          <div id="win-pips" class="win-pips"></div>
        </div>
        <div class="team-score red">
          <small>RED</small>
          <b id="score-red">0</b>
          <div id="pips-red" class="pips red"></div>
        </div>
      </div>

      <div id="kill-feed" class="kill-feed"></div>

      <div class="hud-top-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound">🔊</button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">Ⅱ</button>
      </div>

      <div class="player-panel">
        <div class="loadout-badge"><span id="loadout-icon">🎯</span><b id="loadout-name">RIFLEMAN</b></div>
        <div class="hp-row">
          <small>HP</small>
          <div class="hp-track"><div id="hp-fill"></div></div>
          <b id="hp-text">100</b>
        </div>
        <div class="ability-row">
          <div class="dash-meter"><small>DASH</small><div class="dash-track"><div id="dash-fill"></div></div></div>
          <div id="overdrive-badge" class="overdrive-badge hidden">⚡ OVERDRIVE</div>
        </div>
      </div>

      <div id="pickup-hint" class="pickup-hint hidden">⚡ OVERDRIVE ONLINE</div>
      <div id="overtime-badge" class="overtime-badge hidden">OVERTIME</div>
      <div id="respawn" class="respawn hidden"><b>RESPAWNING</b><span id="respawn-time">2</span></div>
    </div>

    <div id="round-banner" class="round-banner" aria-hidden="true">
      <small id="banner-kicker">ROUND 1</small>
      <h2 id="banner-name">DEPOT</h2>
      <p id="banner-sub">First to 15 kills</p>
    </div>

    <div id="touch-controls" class="touch-controls hidden">
      <div id="stick-move" class="stick"><div class="stick-label">MOVE</div><div class="knob"></div></div>
      <div id="stick-aim" class="stick aim"><div class="stick-label">AIM / FIRE</div><div class="knob"></div></div>
      <button id="btn-dash" class="dash-btn" type="button">DASH</button>
    </div>

    <div id="screen-title" class="screen is-active">
      <div class="title-top"><select id="lang-select" class="lang-select" aria-label="Language"></select></div>
      <div class="title-card">
        <div class="brand-kicker">PIPY GAMES · 4V4 ARENA</div>
        <h1 id="title-text">FRONT WARS</h1>
        <p class="subtitle" id="subtitle-text"></p>
        <div class="feature-chips">
          <span>4v4 BOTS</span><span>3 ROUNDS</span><span>3 CLASSES</span>
        </div>
        <p class="how-to" id="how-to"></p>
        <button id="btn-start" class="cta"></button>
        <button id="btn-howto" class="act secondary howto-btn"></button>
        <p class="best" id="title-best"></p>
      </div>
      <div class="title-art" aria-hidden="true"><div class="art-line"></div><div class="art-line short"></div><div class="art-dot"></div></div>
    </div>

    <div id="screen-loadout" class="screen hidden">
      <div class="modal-card loadout-card">
        <div class="brand-kicker" id="loadout-kicker"></div>
        <h2 id="loadout-title"></h2>
        <p id="loadout-sub" class="screen-sub"></p>
        <div id="loadout-cards" class="loadout-cards"></div>
        <button id="btn-loadout-back" class="act secondary"></button>
      </div>
    </div>

    <div id="screen-round" class="screen hidden">
      <div class="modal-card round-card">
        <div class="brand-kicker" id="round-kicker"></div>
        <h2 id="round-title"></h2>
        <p id="round-sub" class="screen-sub"></p>
        <div id="round-stats" class="round-stats"></div>
        <div id="perk-cards" class="perk-cards"></div>
        <button id="btn-round-next" class="cta hidden"></button>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <div class="modal-card">
        <h2 id="pause-title"></h2>
        <button id="btn-resume" class="cta"></button>
        <button id="btn-restart" class="act secondary"></button>
        <button id="btn-howto-pause" class="act secondary"></button>
        <button id="btn-title" class="act secondary"></button>
        <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
      </div>
    </div>

    <div id="screen-end" class="screen hidden">
      <div class="modal-card end-card">
        <div class="brand-kicker" id="end-kicker"></div>
        <h2 id="end-title"></h2>
        <div id="end-score" class="end-score">2 – 1</div>
        <div class="end-stats">
          <div><small id="end-kills-label"></small><b id="end-kills">0</b></div>
          <div><small id="end-deaths-label"></small><b id="end-deaths">0</b></div>
          <div><small id="end-rounds-label"></small><b id="end-rounds">0/3</b></div>
        </div>
        <p id="end-message"></p>
        <button id="btn-again" class="cta"></button>
        <button id="btn-title-end" class="act secondary"></button>
      </div>
    </div>

    <div id="tutorial" class="tutorial hidden" data-tutorial>
      <div class="tutorial-card">
        <div class="tutorial-head">
          <span id="tutorial-step"></span>
          <button id="tutorial-skip" data-tutorial-skip type="button"></button>
        </div>
        <h3 id="tutorial-title"></h3>
        <p id="tutorial-text"></p>
        <div id="tutorial-dots" class="tutorial-dots"></div>
        <button id="tutorial-next" class="cta hidden" type="button"></button>
      </div>
    </div>

    <div id="toast-layer" class="toast-layer" aria-hidden="true"></div>
    <div id="hurt" class="hurt" aria-hidden="true"></div>

    <div id="rotate" class="rotate-screen" aria-hidden="true">
      <div class="rotate-inner">
        <div class="rotate-phone">▯</div>
        <h2 id="rotate-title"></h2>
        <p id="rotate-text"></p>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
