<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOW NINJA CAT</title>
  <link rel="stylesheet" href="styles.css?v=sn1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-level"></span>
          <span id="hud-count" class="hud-pill"></span>
          <span id="hud-dist" class="hud-pill"></span>
          <span id="hud-chimes" class="hud-pill"></span>
          <span id="hud-shield" class="hud-pill">🛡</span>
          <span class="hud-progress" id="hud-progress"><i id="hud-progress-fill"></i><em>🏁</em></span>
        </div>
        <div class="hud-right">
          <button id="btn-prop-fly" class="hud-btn" aria-label="Bamboo Copter"><span id="prop-fly-count" class="badge"></span>🪁</button>
          <button id="btn-prop-magnet" class="hud-btn" aria-label="Magnet"><span id="prop-magnet-count" class="badge"></span>🧲</button>
          <button id="btn-prop-double" class="hud-btn" aria-label="Double"><span id="prop-double-count" class="badge"></span>×2</button>
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-share" class="hud-btn" aria-label="Share">↗</button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">☰</button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">SHADOW NINJA CAT</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="total-stars"><span id="stars-total"></span></div>
      <button id="btn-start">Start</button>
      <div class="title-btns">
        <button id="btn-shop" class="btn-ghost">Shop</button>
        <button id="btn-missions" class="btn-ghost">Missions</button>
      </div>
      <div id="level-grid" class="level-grid"></div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost">How to Play</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-next">Next Level</button>
        <button id="btn-revive" class="hidden">Revive</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="screen-shop" class="screen hidden">
      <h2 id="shop-title">Shop</h2>
      <div id="shop-chimes" class="shop-chimes"></div>
      <div id="shop-list" class="shop-list"></div>
      <button id="btn-back-shop" class="btn-ghost">Back</button>
    </div>

    <div id="screen-missions" class="screen hidden">
      <h2 id="missions-title">Missions</h2>
      <div id="missions-list" class="missions-list"></div>
      <button id="btn-back-missions" class="btn-ghost">Back</button>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger view</p>
        <button id="btn-rotate-skip">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=sn1"></script>
</body>
</html>
