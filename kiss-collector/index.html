<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="KISS COLLECTOR — collect kisses by cracking 24 sweet little puzzles. Tap, drag, hold and flip your way through a love story.">
  <meta name="theme-color" content="#ff6fa5">
  <title>KISS COLLECTOR · Sweet Puzzle Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">↻</div>
        <p data-i18n="set.rotate">Rotate for the best view</p>
        <button id="btn-rotate-skip" type="button" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Warming up the kiss jar…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
