<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CURSED KEEP</title>
  <meta name="description" content="Build towers, upgrade your defenses and survive ten waves of cursed enemies. A classic path tower-defense game in your browser.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-wave" class="hud-wave"></span>
        <span id="hud-gold" class="hud-gold"></span>
        <span id="hud-lives" class="hud-lives"></span>
      </div>
      <div class="hud-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="buildbar" class="hidden">
      <span id="build-hint" class="build-hint"></span>
      <button id="btn-arrow" class="bb-btn"><span class="bb-name"></span><span class="bb-cost"></span></button>
      <button id="btn-cannon" class="bb-btn"><span class="bb-name"></span><span class="bb-cost"></span></button>
      <button id="btn-frost" class="bb-btn"><span class="bb-name"></span><span class="bb-cost"></span></button>
      <button id="btn-wave" class="wave-btn"></button>
    </div>

    <div id="towerpanel" class="hidden">
      <div class="tp-head"><span id="tp-name"></span><button id="btn-close" class="tp-close"></button></div>
      <div id="tp-stats" class="tp-stats"></div>
      <div class="tp-actions">
        <button id="btn-upgrade" class="tp-btn upgrade"></button>
        <button id="btn-sell" class="tp-btn sell"></button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-win" class="screen hidden">
      <h2 id="win-title"></h2>
      <p class="end-score" id="win-score"></p>
      <button id="btn-again"></button>
      <button id="btn-title" class="secondary"></button>
    </div>

    <div id="screen-lose" class="screen hidden">
      <h2 id="lose-title"></h2>
      <p class="end-score" id="lose-score"></p>
      <button id="btn-again2"></button>
      <button id="btn-title2" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
