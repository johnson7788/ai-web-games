<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT TACTICS</title>
  <link rel="stylesheet" href="styles.css?v=ct1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span class="hud-pill hud-gold" id="hud-coins">0</span>
          <span class="hud-pill hud-gem" id="hud-gems">◇ 0</span>
          <span class="hud-pill" id="hud-mission"></span>
          <span class="hud-pill" id="hud-time"></span>
          <span class="hud-pill" id="hud-income"></span>
          <span class="hud-pill" id="hud-running"></span>
          <span class="hud-pill" id="hud-highest"></span>
          <span class="hud-pill hud-combo hidden" id="hud-combo"></span>
          <span class="hud-pill hud-boost hidden" id="hud-boost"></span>
        </div>
        <div class="hud-right">
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart"></button>
          <button id="btn-home" class="hud-btn" aria-label="Menu"></button>
        </div>
      </div>
    </div>

    <div id="action-panel" class="hidden">
      <button id="btn-recruit" class="action-btn recruit">
        <span id="recruit-label">RECRUIT</span>
        <span id="recruit-cost" class="cost">10</span>
      </button>
      <button id="btn-boost" class="action-btn boost">
        <span id="boost-label">BOOST</span>
        <span id="boost-cost" class="cost">60</span>
      </button>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">CAT TACTICS</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="total-stars" id="stars-total">★ 0</div>
      <button id="btn-start">Start</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost">Replay Guide</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-next" class="hidden">Next Mission</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger board</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=ct1"></script>
</body>
</html>
