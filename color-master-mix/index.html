<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLOR MASTER MIX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312122e'/%3E%3Ccircle cx='5' cy='5' r='2.4' fill='%23ff3b6b'/%3E%3Ccircle cx='11' cy='11' r='2.4' fill='%2333e0ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <div id="game-container">
      <canvas id="canvas"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-row">
          <div class="hud-left">
            <span id="hud-level" class="hud-pill"></span>
            <span id="hud-time" class="hud-pill hud-time"></span>
            <span id="hud-score" class="hud-pill"></span>
            <span id="hud-combo" class="hud-pill hud-combo"></span>
            <span id="hud-progress" class="hud-pill"></span>
          </div>
          <div class="hud-right">
            <button id="btn-magic" class="hud-btn" aria-label="Magic fill"><span id="magic-badge" class="badge"></span>✦</button>
            <button id="btn-undo" class="hud-btn" aria-label="Undo">↩</button>
            <button id="btn-howto" class="hud-btn" aria-label="Replay guide" data-tutorial-replay>?</button>
            <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
            <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
            <button id="btn-home" class="hud-btn" aria-label="Menu">⌂</button>
          </div>
        </div>
      </div>

      <div id="palette" class="hidden" aria-label="Color palette"></div>

      <div id="goal-preview" class="hidden">
        <span id="goal-label"></span>
        <div id="goal-grid"></div>
      </div>

      <div id="screen-title" class="screen is-active">
        <select id="lang-select" class="lang-select" aria-label="Language"></select>
        <h1 id="title-text">COLOR MASTER MIX</h1>
        <p class="subtitle" id="subtitle-text"></p>
        <div id="title-preview" aria-hidden="true"></div>
        <button id="btn-start">Start</button>
        <button id="btn-howto-title" class="btn-ghost" data-tutorial-replay>How to play</button>
        <div id="level-grid"></div>
      </div>

      <div id="screen-pause" class="screen hidden">
        <h2 id="pause-title">Paused</h2>
        <button id="btn-resume">Resume</button>
        <button id="btn-restart2" class="btn-ghost">Restart</button>
        <button id="btn-tut-replay" class="btn-ghost">How to play</button>
        <button id="btn-home3" class="btn-ghost">Menu</button>
        <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
      </div>

      <div id="screen-result" class="screen hidden">
        <h2 id="result-title">Result</h2>
        <div id="result-stars" class="win-stars"></div>
        <div id="result-time" class="win-time"></div>
        <div id="result-meta" class="win-meta"></div>
        <div class="win-btns">
          <button id="btn-retry">Retry</button>
          <button id="btn-next">Next Level</button>
          <button id="btn-home2" class="btn-ghost">Menu</button>
        </div>
      </div>

      <div id="rotate-screen" data-rotate hidden>
        <div class="rotate-card">
          <div class="rotate-icon">📱↻</div>
          <p id="rotate-text">Rotate for a bigger canvas</p>
          <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
        </div>
      </div>

      <div id="tutorial" class="hidden" data-tutorial>
        <div id="tut-card">
          <h3 id="tut-title"></h3>
          <p id="tut-text"></p>
          <div class="tut-btns">
            <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
            <button id="tut-next">Got it</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
