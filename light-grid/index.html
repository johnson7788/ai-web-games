<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LIGHT GRID — power every circuit node: tap to flip a cell and its neighbors, route around diodes and relays, and beat the fuse.">
  <meta name="theme-color" content="#030c07">
  <title>LIGHT GRID · Circuit-Board Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-node"></div>
      <span data-i18n="set.loading">Charging…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
