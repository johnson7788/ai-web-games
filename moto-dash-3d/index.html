<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOTO DASH 3D</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="stage">

    <div id="hud" class="hidden">
      <div id="hud-score-box">
        <span class="hud-label" data-i18n="score">SCORE</span>
        <b id="hud-score">0</b>
        <span id="hud-combo"></span>
      </div>
      <div id="hud-right">
        <span id="hud-speed-box"><b id="hud-speed">0</b><span class="hud-label" data-i18n="kmh">KM/H</span></span>
        <span id="hud-distance">0 m</span>
        <span id="hud-segment" class="seg-day" data-i18n="segmentDay">DAY</span>
      </div>
      <div id="hud-goal">
        <span class="hud-label" data-i18n="goal">GOAL</span>
        <b data-i18n="goalText">WEAVE &amp; GO FAR</b>
      </div>
      <div id="hud-nitro">
        <span class="hud-label" data-i18n="nitro">NITRO</span>
        <div class="bar"><div id="hud-nitro-fill"></div></div>
      </div>
      <div id="tut-road-zone"></div>
    </div>

    <div id="screen-title" class="screen">
      <div id="title-inner">
        <h1 id="title-text">MOTO DASH 3D</h1>
        <p id="subtitle-text"></p>
        <div id="title-best-wrap"><span class="hud-label" data-i18n="best">BEST</span> <b id="title-best">0 m</b></div>
        <div id="title-buttons">
          <button id="btn-start" class="btn primary"></button>
          <button id="btn-howto" class="btn" data-tutorial-replay></button>
        </div>
        <div id="title-meta">
          <select id="lang-select" aria-label="Language"></select>
          <button id="btn-mute" class="btn small"></button>
        </div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume" class="btn primary"></button>
      <button id="btn-restart-pause" class="btn"></button>
      <button id="btn-menu-pause" class="btn"></button>
      <select id="lang-select-pause" aria-label="Language"></select>
    </div>

    <div id="screen-results" class="screen hidden">
      <h2 id="res-title"></h2>
      <p id="res-sub"></p>
      <div id="res-rating" class="rank-D"></div>
      <div id="res-score-wrap"><span class="hud-label" data-i18n="score">SCORE</span> <b id="res-score">0</b></div>
      <div id="res-best-wrap"><span class="hud-label" data-i18n="best">BEST</span> <b id="res-best">0 m</b></div>
      <div id="res-record" class="hidden"></div>
      <div id="res-stats"></div>
      <div id="results-buttons">
        <button id="btn-restart" class="btn primary"></button>
        <button id="btn-share" class="btn"></button>
        <button id="btn-menu" class="btn"></button>
      </div>
    </div>

    <div id="tutorial" data-tutorial class="hidden">
      <div id="tut-highlight"></div>
      <div id="tut-card">
        <div id="tut-dots"></div>
        <p id="tut-text"></p>
        <div id="tut-buttons">
          <button id="tut-next" class="btn primary"></button>
          <button id="tut-skip" class="btn" data-tutorial-skip></button>
        </div>
      </div>
    </div>

    <div id="fx-layer"></div>
    <div id="flash"></div>

    <div id="rotate" class="hidden">
      <div id="rotate-card">
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" class="btn small"></button>
      </div>
    </div>

    <div id="touch" class="hidden">
      <div id="steer-zone" aria-label="steer"></div>
      <button id="btn-throttle" class="touch-action"></button>
      <button id="btn-nitro" class="touch-action"></button>
    </div>

  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
