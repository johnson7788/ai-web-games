<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KEEP GUARD 3D</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="stage">

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-row"><span class="lbl" data-i18n="gold">GOLD</span> <b id="hud-gold">0</b></div>
        <div class="hud-row"><span class="lbl" data-i18n="wave">WAVE</span> <b id="hud-wave">1/10</b></div>
        <div class="hud-row"><span class="lbl" data-i18n="core">CORE</span> <b id="hud-core">20</b></div>
        <div class="hud-row"><span class="lbl" data-i18n="time">TIME</span> <b id="hud-time">0:00</b></div>
      </div>
      <div class="hud-right">
        <div id="hud-build-timer" class="hidden"></div>
        <button id="btn-start-wave" class="btn small"></button>
        <button id="btn-mute" class="btn small icon"></button>
      </div>
    </div>

    <div id="build-bar" class="hidden">
      <button class="tower-btn" data-tower="arrow" id="btn-tower-arrow"><span class="tname" data-i18n="arrow"></span><span class="tdesc" data-i18n="arrowD"></span></button>
      <button class="tower-btn" data-tower="cannon" id="btn-tower-cannon"><span class="tname" data-i18n="cannon"></span><span class="tdesc" data-i18n="cannonD"></span></button>
      <button class="tower-btn" data-tower="ice" id="btn-tower-ice"><span class="tname" data-i18n="ice"></span><span class="tdesc" data-i18n="iceD"></span></button>
      <button class="tower-btn" data-tower="wall" id="btn-tower-wall"><span class="tname" data-i18n="wall"></span><span class="tdesc" data-i18n="wallD"></span></button>
      <div id="sel-panel" class="hidden">
        <span id="sel-info"></span>
        <button id="btn-upgrade" class="btn small"></button>
        <button id="btn-sell" class="btn small danger"></button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <div id="title-inner">
        <h1 id="title-text">KEEP GUARD 3D</h1>
        <p id="subtitle-text"></p>
        <div id="title-best-wrap"><span class="lbl" data-i18n="best">BEST</span> <b id="title-best">0</b></div>
        <div id="title-buttons">
          <button id="btn-start" class="btn primary"></button>
          <button id="btn-howto" class="btn" data-tutorial-replay></button>
        </div>
        <div id="title-meta">
          <select id="lang-select" aria-label="Language"></select>
          <button id="btn-mute-title" class="btn small icon"></button>
        </div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume" class="btn primary"></button>
      <button id="btn-restart-pause" class="btn"></button>
      <button id="btn-menu-pause" class="btn"></button>
      <select id="lang-select-pause" aria-label="Language"></select>
    </div>

    <div id="screen-results" class="screen hidden">
      <h2 id="res-title"></h2>
      <p id="res-sub"></p>
      <div id="res-rating"></div>
      <div id="res-stats"></div>
      <div id="results-buttons">
        <button id="btn-restart" class="btn primary"></button>
        <button id="btn-share" class="btn"></button>
        <button id="btn-menu" class="btn"></button>
      </div>
    </div>

    <div id="tutorial" data-tutorial class="hidden">
      <div id="tut-highlight"></div>
      <div id="tut-card">
        <p id="tut-text"></p>
        <div id="tut-buttons">
          <button id="tut-next" class="btn primary"></button>
          <button id="tut-skip" class="btn" data-tutorial-skip></button>
        </div>
      </div>
    </div>

  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
