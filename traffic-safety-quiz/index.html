<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRAFFIC SAFETY QUIZ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-round" class="hud-pill"></span>
        <span id="hud-q" class="hud-pill"></span>
      </div>
      <div class="hud-center">
        <div id="hud-signal" class="signal"><span class="sig red"></span><span class="sig amber"></span><span class="sig green"></span></div>
        <span id="hud-time" class="hud-pill time"></span>
      </div>
      <div class="hud-right">
        <span id="hud-score" class="hud-pill"></span>
        <span id="hud-combo" class="hud-pill combo"></span>
        <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
        <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">⏸</button>
        <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
        <button id="btn-home" class="hud-btn" aria-label="Menu">⌂</button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">TRAFFIC SAFETY QUIZ</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <button id="btn-start">Start</button>
      <button id="btn-howto2" class="btn-ghost" data-tutorial-replay>How to play</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="result-stars" id="result-stars"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-meta" id="result-meta"></div>
      <div class="result-reason" id="result-reason"></div>
      <div class="result-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="quiz-ui" class="hidden">
      <div id="question-card">
        <span id="question-text"></span>
      </div>
      <div id="answer-row">
        <button id="btn-safe" class="ans safe">✓ SAFE</button>
        <button id="btn-unsafe" class="ans unsafe">✗ UNSAFE</button>
      </div>
      <div id="nav-row">
        <button id="btn-prev" class="nav-btn" aria-label="Previous">‹</button>
        <span id="round-badge"></span>
        <button id="btn-next" class="nav-btn" aria-label="Next">›</button>
      </div>
      <div id="feedback" class="hidden"></div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a better view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
