<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DICE CASCADE — bet rune dice, cast them into a temple pachinko board, and bank your score before the cursed faces wipe it.">
  <meta name="theme-color" content="#0d0805">
  <title>DICE CASCADE · Rune Dice Temple</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-die"></div>
      <span data-i18n="set.loading">Entering the temple…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
