<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DRIFT LIMITS</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="stage">

    <div id="hud" class="hidden">
      <div id="cop-vignette"></div>
      <div id="fx-layer"></div>
      <div class="hud-box" id="hud-score-box">
        <span class="hud-label" data-i18n="score">SCORE</span>
        <span id="hud-score">0</span>
        <span id="hud-mult">×1</span>
      </div>
      <div class="hud-box" id="hud-race-box">
        <span><span class="hud-label" data-i18n="lap">LAP</span> <b id="hud-lap">1/3</b></span>
        <span id="hud-heat" class="heat-1">HEAT 1</span>
        <span id="hud-time">0:00</span>
      </div>
      <div class="hud-box" id="hud-speed-box">
        <b id="hud-speed">0</b><span class="hud-label" data-i18n="kmh">KM/H</span>
      </div>
      <div class="hud-box" id="hud-bars-box">
        <div class="bar-row"><span class="hud-label" data-i18n="nitro">NITRO</span>
          <div class="bar"><div id="hud-nitro-fill"></div></div></div>
        <div class="bar-row"><span class="hud-label" data-i18n="police">POLICE</span>
          <div class="bar bar-police"><div id="hud-police-fill"></div></div>
          <span id="hud-police-m">38m</span></div>
      </div>
      <div id="light-tree" class="hidden">
        <span class="lt red" id="lt-r1"></span><span class="lt red" id="lt-r2"></span><span class="lt red" id="lt-r3"></span><span class="lt green" id="lt-g"></span>
      </div>
      <div id="launch-hint" class="hidden"></div>
    </div>

    <div id="screen-title" class="screen">
      <div id="title-inner">
        <h1 id="title-text">DRIFT LIMITS</h1>
        <p id="subtitle-text"></p>
        <div id="title-best-wrap"><span class="hud-label" data-i18n="best">BEST</span> <b id="title-best">0</b></div>
        <div id="car-cards"></div>
        <h3 id="perk-title"></h3>
        <div id="perk-grid"></div>
        <div id="title-buttons">
          <button id="btn-start" class="btn primary"></button>
          <button id="btn-howto" class="btn" data-tutorial-replay></button>
        </div>
        <div id="title-meta">
          <select id="lang-select" aria-label="Language"></select>
          <button id="btn-mute" class="btn small"></button>
        </div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume" class="btn primary"></button>
      <button id="btn-restart-pause" class="btn"></button>
      <button id="btn-menu-pause" class="btn"></button>
      <select id="lang-select-pause" aria-label="Language"></select>
    </div>

    <div id="screen-results" class="screen hidden">
      <h2 id="res-title"></h2>
      <p id="res-sub"></p>
      <div id="res-rating"></div>
      <div id="res-score-wrap"><span class="hud-label" data-i18n="score">SCORE</span> <b id="res-score">0</b></div>
      <div id="res-best-wrap"><span class="hud-label" data-i18n="best">BEST</span> <b id="res-best">0</b></div>
      <div id="res-record" class="hidden"></div>
      <div id="res-stats"></div>
      <div id="results-buttons">
        <button id="btn-restart" class="btn primary"></button>
        <button id="btn-share" class="btn"></button>
        <button id="btn-menu" class="btn"></button>
      </div>
    </div>

    <div id="tutorial" data-tutorial class="hidden">
      <div id="tut-highlight"></div>
      <div id="tut-card">
        <div id="tut-dots"></div>
        <p id="tut-text"></p>
        <div id="tut-buttons">
          <button id="tut-next" class="btn primary"></button>
          <button id="tut-skip" class="btn" data-tutorial-skip></button>
        </div>
      </div>
    </div>

    <div id="rotate" class="hidden">
      <div id="rotate-card">
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" class="btn small"></button>
      </div>
    </div>

    <div id="touch" class="hidden">
      <button class="steer" data-steer="-1" aria-label="steer left"></button>
      <button class="steer" data-steer="1" aria-label="steer right"></button>
      <button id="btn-nitro" class="touch-action"></button>
      <button id="btn-drift" class="touch-action"></button>
    </div>

  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
