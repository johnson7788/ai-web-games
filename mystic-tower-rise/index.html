<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYSTIC TOWER RISE</title>
  <link rel="stylesheet" href="styles.css?v=mtr1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-goal" class="hud-pill stat-goal"></span>
        <span id="hud-floor" class="hud-pill"></span>
        <span id="hud-hp" class="hud-pill stat-hp"></span>
        <span id="hud-atk" class="hud-pill stat-atk"></span>
        <span id="hud-def" class="hud-pill stat-def"></span>
        <span id="hud-gold" class="hud-pill stat-gold"></span>
      </div>
      <div class="hud-right">
        <span id="hud-keys" class="hud-pill"></span>
        <span id="hud-combo" class="hud-pill stat-combo"></span>
        <button id="btn-howto" class="hud-btn" data-tutorial-replay aria-label="How to play">?</button>
        <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
        <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
        <button id="btn-home" class="hud-btn" aria-label="Menu">⌂</button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <div class="title-glow"></div>
      <h1 id="title-text">MYSTIC TOWER RISE</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <button id="btn-start">Start</button>
      <p class="title-hint" id="title-hint"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-home2" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-home3" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="screen-shop" class="screen hidden">
      <div class="shop-card">
        <h2 id="shop-title">Shop</h2>
        <div class="shop-cost" id="shop-cost"></div>
        <button id="btn-buy-hp" class="shop-btn"></button>
        <button id="btn-buy-atk" class="shop-btn"></button>
        <button id="btn-buy-def" class="shop-btn"></button>
        <button id="btn-shop-leave" class="btn-ghost"></button>
      </div>
    </div>

    <div id="toast" class="hidden"></div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a clearer view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=mtr1"></script>
</body>
</html>
