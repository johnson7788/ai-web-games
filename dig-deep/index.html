<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DIG DEEP — drill a 5-lane shaft through the Earth: break hard blocks, collect diamonds and fossils, switch shovel/drill/laser, and outrun the rising flood to reach the core.">
  <meta name="theme-color" content="#1a1005">
  <title>DIG DEEP · Drill to the Core</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="loading">Drilling…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
