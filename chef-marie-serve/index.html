<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHEF MARIE SERVE</title>
  <link rel="stylesheet" href="styles.css?v=cms1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-level"></span>
          <span id="hud-score" class="hud-pill"></span>
          <span id="hud-plate" class="hud-pill"></span>
          <span id="hud-combo" class="hud-pill"></span>
        </div>
        <div class="hud-right">
          <button id="btn-howto" class="hud-btn" data-tutorial-replay aria-label="How to play">?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart"></button>
          <button id="btn-home" class="hud-btn" aria-label="Menu"></button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">CHEF MARIE SERVE</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <button id="btn-start">Start</button>
      <div id="level-grid" class="level-grid"></div>
      <button id="btn-howto-title" class="btn-ghost" data-tutorial-replay></button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="win-stars" id="result-stars"></div>
      <div id="result-msg"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-next">Next Level</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'"></button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>

    <div id="card-overlay" class="screen hidden" data-card>
      <div class="card-box">
        <h3 id="card-title"></h3>
        <p id="card-text"></p>
        <button id="card-close">Got it</button>
      </div>
    </div>

    <div id="touch-controls" class="hidden">
      <button id="t-left" class="touch-btn touch-left" aria-label="Left">◀</button>
      <button id="t-right" class="touch-btn touch-right" aria-label="Right">▶</button>
      <button id="t-jump" class="touch-btn touch-jump" aria-label="Jump">⤒</button>
    </div>
  </div>
  <script type="module" src="src/main.js?v=cms1"></script>
</body>
</html>
