<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="BRICK SIX — fill honeycomb rings on a hex board, clear three at once for the Royal Jelly gold cascade.">
  <meta name="theme-color" content="#0c2b1f">
  <title>BRICK SIX · Honeycomb Workshop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-rotate" class="touch-rotate" aria-label="Rotate piece" hidden>↻</button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Warming the hive…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
