<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CORGI DASH — herd sheep across Welsh meadows, jump fences, duck under bridges, and chain perfect landings into a sheep surge.">
  <meta name="theme-color" content="#2f6f4f">
  <title>CORGI DASH · Sheep-Herding Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-whistle" class="touch-only" aria-label="Whistle" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-sheep"></div>
      <span data-i18n="set.loading">Herding…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
