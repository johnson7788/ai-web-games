<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LIL HERO SAGA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-act" class="hud-pill"></span>
          <span id="hud-score" class="hud-pill"></span>
          <span id="hud-combo" class="hud-pill combo"></span>
        </div>
        <div class="hud-center">
          <div class="hearts" id="hud-hearts"></div>
          <div class="mp-bars">
            <div class="mp-bar mp-red"><i>R</i><span id="mp-red"></span></div>
            <div class="mp-bar mp-yellow"><i>Y</i><span id="mp-yellow"></span></div>
            <div class="mp-bar mp-blue"><i>B</i><span id="mp-blue"></span></div>
          </div>
        </div>
        <div class="hud-right">
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute">♪</button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">⌂</button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">LIL HERO SAGA</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="best-score"><span id="best-score"></span></div>
      <button id="btn-start">Start</button>
      <button id="btn-howto-title" class="btn-ghost" data-tutorial-replay>How to Play</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-time" id="result-time"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="touch-controls" class="hidden">
      <div class="touch-cluster touch-move">
        <button id="touch-left" aria-label="Left">◀</button>
        <button id="touch-right" aria-label="Right">▶</button>
      </div>
      <div class="touch-cluster touch-spells">
        <button id="touch-red" class="spell r" aria-label="Red">R</button>
        <button id="touch-yellow" class="spell y" aria-label="Yellow">Y</button>
        <button id="touch-blue" class="spell b" aria-label="Blue">B</button>
      </div>
      <div class="touch-cluster touch-jump">
        <button id="touch-jump" aria-label="Jump">▲</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
