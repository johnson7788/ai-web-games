<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TANK CLASSIC 1990</title>
  <link rel="stylesheet" href="styles.css?v=tank1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-level"></span>
          <span id="hud-lives" class="hud-pill"></span>
          <span id="hud-enemies" class="hud-pill"></span>
        </div>
        <div class="hud-center">
          <span id="hud-combo" class="hud-combo hidden"></span>
          <span id="hud-score"></span>
        </div>
        <div class="hud-right">
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">≡</button>
        </div>
      </div>
    </div>

    <div id="touch-controls" class="hidden">
      <div class="dpad">
        <button class="tc-btn" data-dir="up" aria-label="Up">▲</button>
        <button class="tc-btn" data-dir="left" aria-label="Left">◀</button>
        <button class="tc-btn" data-dir="right" aria-label="Right">▶</button>
        <button class="tc-btn" data-dir="down" aria-label="Down">▼</button>
      </div>
      <button id="btn-fire" class="tc-fire" aria-label="Fire">FIRE</button>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">TANK CLASSIC 1990</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="best"><span id="best-text"></span></div>
      <button id="btn-start">Start</button>
      <button id="btn-title-howto" class="btn-ghost" data-tutorial-replay>How to play</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost" data-tutorial-replay>How to play</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title"></h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-next">Next Level</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger battlefield</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=tank1"></script>
</body>
</html>
