<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RETRO RACER GT</title>
  <link rel="stylesheet" href="styles.css?v=rr1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span class="hud-label" id="hud-score-label">SCORE</span>
          <span id="hud-score" class="hud-val">0</span>
          <span class="hud-label" id="hud-speed-label">KM/H</span>
          <span id="hud-speed" class="hud-val">0</span>
          <span class="hud-label" id="hud-best-label">BEST</span>
          <span id="hud-best" class="hud-val">0</span>
        </div>
        <div class="hud-right">
          <span id="hud-combo" class="hud-pill combo hidden">COMBO x1</span>
          <span id="hud-tier" class="hud-pill tier">TIER 1</span>
          <button id="btn-nitro-hud" class="hud-btn nitro" aria-label="Nitro">⚡ NITRO</button>
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute">🔊</button>
          <button id="btn-pause" class="hud-btn" aria-label="Pause">⏸</button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <div class="title-card">
        <h1 id="title-text">RETRO RACER GT</h1>
        <p class="subtitle" id="subtitle-text"></p>
        <div class="title-meta" id="title-best">BEST 0</div>
        <button id="btn-start" class="btn-primary">Start</button>
        <button id="btn-howto-title" class="btn-ghost" data-tutorial-replay>How to play</button>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <div class="panel">
        <h2 id="pause-title">Paused</h2>
        <button id="btn-resume" class="btn-primary">Resume</button>
        <button id="btn-restart2" class="btn-ghost">Restart</button>
        <button id="btn-home3" class="btn-ghost">Menu</button>
        <select id="lang-select-pause" class="lang-select inline" aria-label="Language"></select>
      </div>
    </div>

    <div id="screen-result" class="screen hidden">
      <div class="panel result">
        <h2 id="result-title">Wrecked</h2>
        <div id="result-lines" class="result-lines"></div>
        <button id="btn-retry" class="btn-primary">Retry</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="controls" class="hidden">
      <button id="btn-left" class="ctl-btn" aria-label="Turn left">◀</button>
      <button id="btn-nitro" class="ctl-btn nitro" aria-label="Nitro">⚡ NITRO</button>
      <button id="btn-right" class="ctl-btn" aria-label="Turn right">▶</button>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a wider road</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next" class="btn-primary">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=rr1"></script>
</body>
</html>
