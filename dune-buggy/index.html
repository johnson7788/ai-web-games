<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DUNE BUGGY — a Baja rally arcade: ride the golden sand ridge, tune your tire pressure, and beat the clock across 12 desert stages.">
  <meta name="theme-color" content="#c9863f">
  <title>DUNE BUGGY · Desert Rally</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="stage-toast" class="stage-toast hidden"></div>

    <div id="touch-controls" class="touch-only" aria-hidden="true">
      <button id="btn-left" class="touch-btn touch-left" aria-label="Steer left">◀</button>
      <button id="btn-right" class="touch-btn touch-right" aria-label="Steer right">▶</button>
      <button id="btn-gas" class="touch-btn touch-gas" aria-label="Throttle">▲</button>
      <button id="btn-brake" class="touch-btn touch-brake" aria-label="Brake">▼</button>
      <button id="btn-tune" class="touch-btn touch-tune" aria-label="Tire pressure">T</button>
    </div>

    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-sun"></div>
      <span data-i18n="set.loading">Kicking up sand…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
