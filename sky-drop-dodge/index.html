<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SKY DROP DODGE — dash across a city rooftop, raise your energy umbrella, dodge falling flowerpots and fridges, and ride the wind lanes.">
  <meta name="theme-color" content="#0a0f1a">
  <title>SKY DROP DODGE · Rooftop Umbrella Dodger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-block" class="touch-only" aria-label="Umbrella" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-umbrella"></div>
      <span data-i18n="set.loading">Climbing…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
