<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BEAR DASH RUN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-bar">
        <div class="hud-left">
          <span id="hud-level" class="hud-pill"></span>
          <span id="hud-score" class="hud-pill"></span>
          <span id="hud-stars" class="hud-pill"></span>
          <span id="hud-combo" class="hud-pill combo"></span>
        </div>
        <div class="hud-right">
          <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">BEAR DASH RUN</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="title-hints"><span id="hint-run"></span><span id="hint-jump"></span><span id="hint-stomp"></span></div>
      <button id="btn-start" class="btn-primary">Start</button>
      <button id="btn-howto" class="btn-ghost" data-tutorial-replay>How to play</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <div class="panel">
        <h2 id="pause-title">Paused</h2>
        <button id="btn-resume" class="btn-primary">Resume</button>
        <button id="btn-restart" class="btn-ghost">Restart</button>
        <button id="btn-howto2" class="btn-ghost" data-tutorial-replay>How to play</button>
        <button id="btn-home" class="btn-ghost">Menu</button>
        <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
      </div>
    </div>

    <div id="screen-result" class="screen hidden">
      <div class="panel">
        <h2 id="result-title">Result</h2>
        <div class="win-stars" id="result-stars"></div>
        <div class="win-score" id="result-score"></div>
        <div class="win-best" id="result-best"></div>
        <div class="win-btns">
          <button id="btn-retry" class="btn-primary">Retry</button>
          <button id="btn-next" class="btn-primary hidden">Next Level</button>
          <button id="btn-home2" class="btn-ghost">Menu</button>
        </div>
      </div>
    </div>

    <div id="touch-controls" class="hidden">
      <button id="btn-left" class="touch-btn" aria-label="Left">◀</button>
      <button id="btn-right" class="touch-btn" aria-label="Right">▶</button>
      <button id="btn-jump" class="touch-btn jump" aria-label="Jump">▲</button>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for the best view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next" class="btn-primary">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
