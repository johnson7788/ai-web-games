<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PIRATE ESCAPE RUN</title>
  <link rel="stylesheet" href="styles.css?v=per1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-bar">
        <span id="hud-score">0m</span>
        <span id="hud-best">Best 0m</span>
        <span id="hud-coins" class="hud-pill">$ 0</span>
        <span id="hud-stars" class="hud-pill">★ 0</span>
        <span id="hud-combo" class="hud-pill hud-combo hidden">Combo ×0</span>
        <span class="hud-spacer"></span>
        <button id="btn-mute" class="hud-btn" aria-label="Mute">♪</button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">PIRATE ESCAPE RUN</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <button id="btn-start">Start</button>
      <button id="btn-howto" class="btn-ghost" data-tutorial-replay>How to play</button>
      <div class="title-stats" id="stars-total"></div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart" class="btn-ghost">Menu</button>
      <button id="btn-howto-pause" class="btn-ghost" data-tutorial-replay>How to play</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Game Over</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-score" id="result-score"></div>
      <div class="win-meta" id="result-meta"></div>
      <button id="btn-retry">Retry</button>
      <button id="btn-home" class="btn-ghost">Menu</button>
    </div>

    <div id="screen-revive" class="screen hidden">
      <h2 id="revive-title">Revive</h2>
      <p id="revive-text"></p>
      <button id="btn-revive">Revive</button>
      <button id="btn-revive-no" class="btn-ghost">No thanks</button>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate your phone for the best view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=per1"></script>
</body>
</html>
