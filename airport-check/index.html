<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AIRPORT CHECK</title>
  <meta name="description" content="Check passports, scan luggage and catch smugglers. An airport security inspection game you can play in your browser.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-shift" class="hud-shift"></span>
        <span id="hud-score"></span>
        <span id="hud-strikes" class="hud-strikes"></span>
      </div>
      <div class="hud-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="actions" class="hidden">
      <div id="feedback" class="feedback"></div>
      <div class="action-row">
        <button id="btn-approve" class="act approve"></button>
        <button id="btn-deny" class="act deny"></button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-over" class="screen hidden">
      <h2 id="over-title"></h2>
      <p class="over-score" id="over-score"></p>
      <button id="btn-again"></button>
      <button id="btn-title" class="secondary"></button>
    </div>

    <div id="screen-clear" class="screen hidden">
      <h2 id="clear-title"></h2>
      <p class="clear-score" id="clear-score"></p>
      <button id="btn-next"></button>
      <button id="btn-title2" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
