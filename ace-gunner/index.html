<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE GUNNER</title>
  <link rel="stylesheet" href="styles.css?v=ace1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-left">
          <span id="hud-wave" class="hud-pill"></span>
          <span id="hud-base" class="hud-pill"></span>
          <span class="hud-bar"><span id="hud-base-bar"></span></span>
          <span id="hud-quiver" class="hud-pill"></span>
        </div>
        <div class="hud-right">
          <span id="hud-gold" class="hud-pill gold"></span>
          <span id="hud-streak" class="hud-pill streak"></span>
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">⌂</button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">ACE GUNNER</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="best-label"><span id="best-label"></span></div>
      <button id="btn-start">Start</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost">Replay Guide</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">Result</h2>
      <div class="result-meta" id="result-meta"></div>
      <div class="result-score">Score <span id="result-score">0</span></div>
      <div class="win-btns">
        <button id="btn-retry">Retry</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="screen-upgrade" class="screen hidden">
      <h2 id="upgrade-title">Choose an Upgrade</h2>
      <div id="upgrade-cards"></div>
      <button id="btn-upgrade-skip" class="btn-ghost">Skip</button>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a wider wall</p>
        <button id="btn-rotate-skip">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=ace1"></script>
</body>
</html>
