<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAT VS DOG WAR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-stage" class="hud-pill"></span>
        <span id="hud-time" class="hud-pill time"></span>
        <span id="hud-score" class="hud-pill score"></span>
        <span id="hud-target" class="hud-pill"></span>
        <span id="hud-combo" class="hud-pill combo"></span>
      </div>
      <div class="hud-right">
        <span id="hud-hearts" class="hud-pill hearts"></span>
        <span id="hud-best" class="hud-pill"></span>
        <button id="hud-mute" class="hud-btn" aria-label="Mute">🔊</button>
        <button id="hud-howto" class="hud-btn" data-tutorial-replay aria-label="How to play">?</button>
        <button id="hud-restart" class="hud-btn" aria-label="Restart">↻</button>
        <button id="hud-home" class="hud-btn" aria-label="Menu">⌂</button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <div class="title-card">
        <h1 id="title-text">CAT VS DOG WAR</h1>
        <p class="subtitle" id="subtitle-text"></p>
        <button id="btn-start" class="btn-primary">Start</button>
        <div class="title-row">
          <button id="title-howto" class="btn-ghost" data-tutorial-replay>How to play</button>
          <button id="title-mute" class="btn-ghost">Mute</button>
        </div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <div class="panel">
        <h2 id="pause-title">Paused</h2>
        <button id="btn-resume" class="btn-primary">Resume</button>
        <button id="pause-restart" class="btn-ghost">Restart</button>
        <button id="pause-home" class="btn-ghost">Menu</button>
        <button id="pause-howto" class="btn-ghost" data-tutorial-replay>How to play</button>
        <select id="lang-select-pause" class="lang-select inline" aria-label="Language"></select>
      </div>
    </div>

    <div id="screen-result" class="screen hidden">
      <div class="panel">
        <h2 id="result-title"></h2>
        <div class="result-stars" id="result-stars"></div>
        <div class="result-line" id="result-score"></div>
        <div class="result-line" id="result-best"></div>
        <div class="result-line newbest hidden" id="result-newbest"></div>
        <div class="result-line muted" id="result-reason"></div>
        <button id="btn-retry" class="btn-primary">Play Again</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate your device for the best view</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next" class="btn-primary">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
