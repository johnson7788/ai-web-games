<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="GEM CASCADE — blast same-colored gem clusters, charge the pickaxe, and chain a mineral vein cave-in across three mines.">
  <meta name="theme-color" content="#12081f">
  <title>GEM CASCADE · Mineral Vein Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Mining…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
