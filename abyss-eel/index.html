<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ABYSS EEL — dive as a glowing deep-sea eel, smash numbered coral walls, chain combos, and burn your own light to dash through the abyss.">
  <meta name="theme-color" content="#010409">
  <title>ABYSS EEL · Deep-Sea Glow Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-dash" class="touch-only" aria-label="Dash" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Diving…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
