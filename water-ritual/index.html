<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="WATER RITUAL — run a teahouse. Hold to pour, hit the water line, and catch the right temperature for a perfect golden-ripple cup.">
  <meta name="theme-color" content="#f7ead6">
  <title>WATER RITUAL · Teahouse Pouring</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-skip" class="touch-only" aria-label="Skip guest" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-steam"></div>
      <span data-i18n="set.loading">Steeping…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
