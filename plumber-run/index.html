<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PLUMBER RUN — run, jump, and sling a boomerang wrench through the steam city as wrench master Aban.">
  <meta name="theme-color" content="#0b1220">
  <title>PLUMBER RUN · Steam City Platformer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <div id="touch-bar" class="touch-bar hidden">
      <button id="btn-left" class="touch-btn" type="button" aria-label="Left">◀</button>
      <button id="btn-right" class="touch-btn" type="button" aria-label="Right">▶</button>
      <button id="btn-jump" class="touch-btn touch-btn-big" type="button" aria-label="Jump">⤒</button>
      <button id="btn-wrench" class="touch-btn" type="button" aria-label="Wrench">🛠</button>
      <button id="btn-steam" class="touch-btn" type="button" aria-label="Steam">♨</button>
    </div>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Fixing pipes…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
