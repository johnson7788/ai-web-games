<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>COLOR CLASH</title>
  <meta name="description" content="Match color or number, play special cards, and empty your hand first. A fast UNO-style card game against two bots.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-wins" class="hud-wins"></span>
        <span id="hud-losses"></span>
      </div>
      <div class="hud-right">
        <button id="btn-pass" class="pass-btn hidden"></button>
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="colorpicker" class="hidden">
      <div id="cp-title" class="cp-title"></div>
      <div class="cp-row">
        <button id="cp-red" class="cp-btn" data-color="red" style="background:#ef4444"></button>
        <button id="cp-yellow" class="cp-btn" data-color="yellow" style="background:#fbbf24"></button>
        <button id="cp-green" class="cp-btn" data-color="green" style="background:#22c55e"></button>
        <button id="cp-blue" class="cp-btn" data-color="blue" style="background:#3b82f6"></button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-end" class="screen hidden">
      <h2 id="end-title"></h2>
      <p class="end-sub" id="end-sub"></p>
      <button id="btn-again"></button>
      <button id="btn-title" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
