<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKY STRIKE 1942</title>
  <link rel="stylesheet" href="styles.css?v=ss2">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="action-hint" class="hidden">MOVE TO AIM · HOLD TO FIRE</div>

    <div id="hud" class="hidden">
      <div class="hud-bar">
        <div class="hud-left">
          <span id="hud-score" class="hud-pill">Score 0</span>
          <span id="hud-level" class="hud-pill">Wave 1</span>
          <span id="hud-kills" class="hud-pill">Kills 0/12</span>
          <span id="hud-combo" class="hud-pill">Combo 0</span>
          <span id="hud-lives" class="hud-lives">♥♥♥</span>
        </div>
        <div class="hud-right">
          <button id="btn-help" class="hud-btn" aria-label="How to play">?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute">♪</button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">R</button>
          <button id="btn-home" class="hud-btn" aria-label="Menu">H</button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">SKY STRIKE 1942</h1>
      <p class="subtitle" id="subtitle-text">NEON AIR RAID</p>
      <div class="best-line" id="best-score">Best 0</div>
      <button id="btn-start">Launch</button>
      <button id="btn-howto-title" class="btn-ghost" data-tutorial-replay>How to play</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <p class="pause-hint">Press P or Esc to resume</p>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-tut-replay" class="btn-ghost" data-tutorial-replay>How to play</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title">SECTOR CLEAR</h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-score" id="result-score">Score 0</div>
      <div class="win-best" id="result-best">Best 0</div>
      <div class="win-newbest hidden" id="result-newbest">NEW BEST</div>
      <div class="win-btns">
        <button id="btn-retry">Fly Again</button>
        <button id="btn-next" class="hidden">Next Wave</button>
        <button id="btn-home2" class="btn-ghost">Menu</button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text">Rotate for a bigger sky</p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title">Pilot briefing</h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=ss2"></script>
</body>
</html>
