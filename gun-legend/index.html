<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="GUN LEGEND — a Hong Kong neon alley shooter: aim, fire twin revolvers, roll through bullet curtains, and trigger the white-dove John Woo moment.">
  <meta name="theme-color" content="#0a1a2e">
  <title>GUN LEGEND · Neon Alley Shooter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-roll" class="touch-only" aria-label="Roll" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <span data-i18n="set.loading">Loading…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
