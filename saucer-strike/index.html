<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SAUCER STRIKE — defend a retro radar station. Drag the railgun to aim & charge, release to fire, and intercept waves of UFOs across 12 escalating waves.">
  <meta name="theme-color" content="#140a04">
  <title>SAUCER STRIKE · Radar Defense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-tracer" class="touch-only" aria-label="Tracer" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-orb"></div>
      <span data-i18n="set.loading">Locking on…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
