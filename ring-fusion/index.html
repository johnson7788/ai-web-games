<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RING FUSION</title>
  <link rel="stylesheet" href="styles.css?v=rf1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="mode-goal" class="hidden"></div>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <span id="hud-level" class="hud-pill"></span>
          <span id="hud-progress" class="hud-pill"></span>
          <span id="hud-time" class="hud-pill hidden"></span>
        </div>
        <div class="hud-right">
          <span id="hud-score" class="hud-pill"></span>
          <span id="hud-best" class="hud-pill"></span>
          <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
          <button id="btn-pause" class="hud-btn" aria-label="Pause">⏸</button>
        </div>
      </div>
      <div class="hud-side">
        <div id="hud-combo" class="hidden"></div>
        <div id="hud-burst-wrap">
          <div id="hud-burst-label"></div>
          <div id="hud-burst-bar"><div id="hud-burst-fill"></div></div>
          <button id="btn-burst" class="hud-btn"></button>
        </div>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="title-btns">
        <button id="btn-start"></button>
        <button id="btn-time" class="btn-ghost"></button>
        <button id="btn-howto-title" class="btn-ghost" data-tutorial-replay></button>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart2" class="btn-ghost"></button>
      <button id="btn-home3" class="btn-ghost"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title"></h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry"></button>
        <button id="btn-next" class="hidden"></button>
        <button id="btn-home2" class="btn-ghost"></button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'"></button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-spotlight"></div>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip></button>
          <button id="tut-next"></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=rf1"></script>
</body>
</html>
