<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="Street Warfare — a free 3D FPS game in your browser. Tactical street combat with squad AI, fully procedural city, weapons and audio. WASD to move, mouse to aim, click to fire." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101418'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23ffb02a' stroke-width='4'/%3E%3Cpath d='M32 6v14M32 44v14M6 32h14M44 32h14' stroke='%23ffb02a' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23ffb02a'/%3E%3C/svg%3E" />
    <title>Street Warfare — Free 3D FPS Game</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }

      /* Boot splash: visible while the procedural world generates (heavy). */
      #sw-splash {
        position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; text-align: center;
        background: radial-gradient(120% 90% at 50% 0%, #10161c 0%, #070a0d 70%, #04060a 100%);
        color: rgba(238,244,247,.95);
        font-family: "Avenir Next Condensed","DIN Alternate","Roboto Condensed","Arial Narrow","Helvetica Neue",Inter,system-ui,sans-serif;
        letter-spacing: .06em; text-transform: uppercase;
      }
      #sw-splash .sw-s-brand {
        font-family: "DIN Condensed","Avenir Next Condensed","Oswald","Arial Narrow",Impact,system-ui,sans-serif;
        font-size: clamp(44px, 8vw, 84px); font-weight: 700; letter-spacing: .05em; line-height: 1;
        text-shadow: 0 2px 3px rgba(0,0,0,.95);
      }
      #sw-splash .sw-s-brand b { color: #ffb02a; }
      #sw-splash .sw-s-msg { font-size: 12px; letter-spacing: .3em; color: rgba(214,227,234,.6); }
      #sw-splash .sw-s-bar { width: 220px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
      #sw-splash .sw-s-bar i {
        display: block; height: 100%; width: 40%; background: #ffb02a;
        animation: sw-scan 1.1s ease-in-out infinite alternate;
      }
      @keyframes sw-scan { from { transform: translateX(-60%); } to { transform: translateX(260%); } }
      #sw-splash .sw-s-err {
        max-width: 80vw; font: 11px/1.5 ui-monospace,monospace; color: #ff8f85;
        white-space: pre-wrap; text-transform: none; letter-spacing: 0;
      }

      /* Portal chrome: sound toggle + open-source credit, bottom centre. */
      #sw-chrome {
        position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        z-index: 40; pointer-events: none;
        font: 600 10px/1.3 "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
        letter-spacing: .14em; text-transform: uppercase;
      }
      #sw-sound {
        pointer-events: auto; cursor: pointer;
        padding: 4px 12px; color: rgba(238,244,247,.92);
        background: rgba(12,16,20,.66); border: 1px solid rgba(255,255,255,.22);
        border-radius: 6px; font: inherit; letter-spacing: inherit; text-transform: inherit;
      }
      #sw-sound:hover { border-color: #ffb02a; color: #ffb02a; }
      #sw-credit {
        color: rgba(214,227,234,.42); text-shadow: 0 1px 2px rgba(0,0,0,.8);
        white-space: nowrap;
      }
      #sw-credit a { color: inherit; text-decoration: none; pointer-events: auto; }
      #sw-credit a:hover { color: rgba(238,244,247,.8); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="sw-splash" aria-live="polite">
      <div class="sw-s-brand">STREET <b>WARFARE</b></div>
      <div class="sw-s-msg" data-i18n="GENERATING CITY BLOCK…">GENERATING CITY BLOCK…</div>
      <div class="sw-s-bar"><i></i></div>
    </div>
    <div id="sw-chrome">
      <button id="sw-sound" type="button" aria-label="Toggle sound">Sound: On</button>
      <div id="sw-credit">Based on mshumer/Claude-of-Duty (MIT) — <a href="https://github.com/mshumer/Claude-of-Duty" target="_blank" rel="noopener">github.com/mshumer/Claude-of-Duty</a></div>
    </div>
    <script>
      // UI clicks must not reach the game's window-level mousedown handler
      // (otherwise pressing Resume / the language toggle fires a stray round).
      document.addEventListener('mousedown', function (e) {
        var t = e.target;
        if (t && t.closest && t.closest('#pipy-lang-btn,#sw-chrome,.ow-menu,#sw-title,#sw-end')) {
          e.stopPropagation();
        }
      }, true);
      // Sound toggle (portal requirement: one visible control mutes everything).
      // The game builds its audio graph on the first user gesture
      // (window.__AUDIO__); setMasterVolume is a safe no-op before that, so we
      // re-apply shortly after in case the graph is still spinning up.
      (function () {
        var btn = document.getElementById('sw-sound');
        var muted = false;
        function apply() {
          try { window.__AUDIO__ && window.__AUDIO__.setMasterVolume(muted ? 0 : 0.95); } catch (e) { /* audio optional */ }
        }
        btn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          muted = !muted;
          btn.textContent = muted ? 'Sound: Off' : 'Sound: On';
          apply();
          setTimeout(apply, 300);
          setTimeout(apply, 1200);
        });
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
