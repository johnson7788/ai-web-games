<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRAVITY GOLF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <span class="hud-item"><span class="hud-label" id="hud-dist-label"></span><b id="hud-dist">0</b><i class="unit"></i></span>
        <span class="hud-item"><span class="hud-label" id="hud-best-label"></span><b id="hud-best">0</b><i class="unit"></i></span>
        <span class="hud-item"><span class="hud-label" id="hud-coins-label"></span><span class="coin-ico"></span><b id="hud-coins">0</b></span>
      </div>
      <div class="hud-row hud-row2">
        <span id="hud-planet" class="hud-planet"></span>
        <span class="hud-item hud-shot-wrap"><span class="hud-label" id="hud-shot-label"></span><span id="hud-shot" class="shot-dots" role="img"></span></span>
      </div>
      <div id="power-bar" class="hidden"><div id="power-fill"></div></div>
    </div>

    <div id="banner" class="hidden"></div>
    <div id="toast" class="hidden"></div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">GRAVITY GOLF</h1>
      <p class="subtitle" id="tagline">One swing to the moon.</p>
      <p class="title-best" id="title-best"></p>
      <button id="btn-start" class="btn-primary">START</button>
      <p class="hint" id="title-hint"></p>
    </div>

    <div id="screen-upgrade" class="screen screen-soft hidden">
      <h2 id="upgrade-title">UPGRADES</h2>
      <div id="upgrade-cards"></div>
      <button id="btn-close-upgrade" class="btn-secondary">CLOSE</button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">PAUSED</h2>
      <button id="btn-resume" class="btn-primary">RESUME</button>
      <button id="btn-restart" class="btn-secondary">RESTART</button>
      <button id="btn-mute" class="btn-secondary">SOUND: ON</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
