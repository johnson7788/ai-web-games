<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LUDO PARTY</title>
  <meta name="description" content="Roll the dice, race your tokens around the board, and bring all four home before the bot. Classic Ludo.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left"></div>
      <div class="hud-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="panel" class="hidden">
      <div id="dice-face" class="dice-face">?</div>
      <button id="btn-roll" class="roll-btn"></button>
      <div id="turn-status" class="turn-status"></div>
      <div class="progress-block">
        <div id="p0-progress" class="progress p0"></div>
        <div id="p1-progress" class="progress p1"></div>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-win" class="screen hidden">
      <h2 id="win-title"></h2>
      <button id="btn-again"></button>
      <button id="btn-title" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
