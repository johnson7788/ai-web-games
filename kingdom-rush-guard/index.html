<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINGDOM RUSH GUARD</title>
  <link rel="stylesheet" href="styles.css?v=krg1">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-gold" class="hud-pill hud-gold"></span>
        <span id="hud-hp" class="hud-pill hud-hp"></span>
        <span id="hud-wave" class="hud-pill"></span>
        <span id="hud-combo" class="hud-pill hud-combo"></span>
      </div>
      <div class="hud-right">
        <button id="btn-orbital" class="hud-btn hud-orbital" aria-label="Orbital strike"></button>
        <button id="btn-howto" class="hud-btn" aria-label="How to play" data-tutorial-replay>?</button>
        <button id="btn-mute" class="hud-btn" aria-label="Mute"></button>
        <button id="btn-restart" class="hud-btn" aria-label="Restart">↻</button>
        <button id="btn-home" class="hud-btn" aria-label="Menu">≡</button>
      </div>
    </div>

    <div id="build-menu" class="hidden">
      <div id="build-title" class="build-title"></div>
      <div id="build-actions" class="build-actions"></div>
      <div id="build-close" class="build-close">✕</div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text">KINGDOM RUSH GUARD</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <div class="total-stars"><span id="stars-total"></span></div>
      <button id="btn-start" class="btn-primary"></button>
      <div id="level-grid" class="level-grid"></div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume" class="btn-primary"></button>
      <button id="btn-restart2" class="btn-ghost"></button>
      <button id="btn-tut-replay" class="btn-ghost"></button>
      <button id="btn-home3" class="btn-ghost"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-result" class="screen hidden">
      <h2 id="result-title"></h2>
      <div class="win-stars" id="result-stars"></div>
      <div class="win-meta" id="result-meta"></div>
      <div class="win-btns">
        <button id="btn-retry" class="btn-primary"></button>
        <button id="btn-next" class="btn-primary hidden"></button>
        <button id="btn-home2" class="btn-ghost"></button>
      </div>
    </div>

    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'"></button>
      </div>
    </div>

    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip></button>
          <button id="tut-next" class="btn-primary"></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js?v=krg1"></script>
</body>
</html>
