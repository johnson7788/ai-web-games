<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HAZARD HOUSE</title>
  <meta name="description" content="A local 1-4 player party game. Dodge spike tiles and bombs, outlast your friends, and be the last one standing. First to 3 rounds wins.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left"></div>
      <div class="hud-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <div class="players-row">
        <span id="players-label" class="players-label"></span>
        <div class="count-btns">
          <button id="count-1" class="count-btn">1P</button>
          <button id="count-2" class="count-btn">2P</button>
          <button id="count-3" class="count-btn">3P</button>
          <button id="count-4" class="count-btn">4P</button>
        </div>
      </div>
      <p class="controls-hint" id="controls-hint"></p>
      <button id="btn-start"></button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-restart" class="secondary"></button>
      <button id="btn-title" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <div id="screen-end" class="screen hidden">
      <h2 id="end-title"></h2>
      <button id="btn-again"></button>
      <button id="btn-title-end" class="secondary"></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
