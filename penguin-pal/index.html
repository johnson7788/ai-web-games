<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PENGUIN PAL</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- 顶部 HUD：等级/目标/金币 + 四项健康条（不透明，避免遮挡判定） -->
    <div id="hud" class="hidden">
      <div class="hud-inner">
        <div class="hud-left">
          <div class="hud-level">
            <span id="hud-level-label" class="level-badge">Lv.1</span>
            <div class="xp-bar"><div id="xp-fill"></div></div>
          </div>
          <span id="hud-goal" class="hud-goal"></span>
        </div>
        <div class="hud-right">
          <span id="hud-gold" class="hud-gold"></span>
          <span id="hud-combo" class="hud-combo hidden"></span>
          <button id="btn-shop" class="hud-btn" aria-label="Shop">🛒</button>
          <button id="btn-mute" class="hud-btn" aria-label="Mute">🔊</button>
          <button id="btn-home" class="hud-btn" aria-label="Home">🏠</button>
        </div>
      </div>
      <div class="hud-stats">
        <div class="stat"><span class="stat-ico">🍗</span><div class="meter"><div class="meter-fill fill-full" id="fill-full"></div></div><span class="stat-label" id="label-full"></span></div>
        <div class="stat"><span class="stat-ico">⚡</span><div class="meter"><div class="meter-fill fill-energy" id="fill-energy"></div></div><span class="stat-label" id="label-energy"></span></div>
        <div class="stat"><span class="stat-ico">😊</span><div class="meter"><div class="meter-fill fill-mood" id="fill-mood"></div></div><span class="stat-label" id="label-mood"></span></div>
        <div class="stat"><span class="stat-ico">💦</span><div class="meter"><div class="meter-fill fill-clean" id="fill-clean"></div></div><span class="stat-label" id="label-clean"></span></div>
      </div>
    </div>

    <!-- 底部动作条（不透明背板，与画布角色纵向分离） -->
    <div id="actions" class="hidden">
      <button class="act-btn" data-action="feed"><span class="act-ico">🍗</span><span class="act-label">Feed</span></button>
      <button class="act-btn" data-action="wash"><span class="act-ico">🛁</span><span class="act-label">Wash</span></button>
      <button class="act-btn" data-action="rest"><span class="act-ico">💤</span><span class="act-label">Rest</span></button>
      <button class="act-btn" data-action="play"><span class="act-ico">⚽</span><span class="act-label">Play</span></button>
      <button class="act-btn" data-action="train"><span class="act-ico">📖</span><span class="act-label">Train</span></button>
      <button class="act-btn" data-action="work"><span class="act-ico">💼</span><span class="act-label">Work</span></button>
    </div>

    <!-- 商店面板 -->
    <div id="shop-panel" class="panel hidden">
      <h3 id="shop-title"></h3>
      <button class="shop-item" data-item="fish"><span class="shop-ico">🐟</span><b id="buy-fish"></b><span class="shop-cost">-5g</span><span class="shop-desc" id="fish-desc"></span></button>
      <button class="shop-item" data-item="icecream"><span class="shop-ico">🍦</span><b id="buy-icecream"></b><span class="shop-cost">-12g</span><span class="shop-desc" id="icecream-desc"></span></button>
      <button class="shop-item" data-item="toy"><span class="shop-ico">🧸</span><b id="buy-toy"></b><span class="shop-cost">-18g</span><span class="shop-desc" id="toy-desc"></span></button>
      <button id="btn-shop-close" class="btn-ghost"></button>
    </div>

    <!-- 标题屏 -->
    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <div class="title-penguin">🐧</div>
      <h1 id="title-text">PENGUIN PAL</h1>
      <p class="subtitle" id="subtitle-text"></p>
      <button id="btn-start">Start</button>
      <button id="btn-howto" class="btn-ghost" data-tutorial-replay>How to Play</button>
    </div>

    <!-- 暂停屏 -->
    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title">Paused</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart2" class="btn-ghost">Restart</button>
      <button id="btn-howto2" class="btn-ghost" data-tutorial-replay>How to Play</button>
      <button id="btn-home3" class="btn-ghost">Menu</button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>

    <!-- 结算屏 -->
    <div id="screen-result" class="screen hidden">
      <h2 id="result-title"></h2>
      <div id="result-stars" class="result-stars"></div>
      <div id="result-msg"></div>
      <button id="btn-new">New Pal</button>
      <button id="btn-home2" class="btn-ghost">Menu</button>
    </div>

    <!-- 竖屏提示 -->
    <div id="rotate-screen" data-rotate hidden>
      <div class="rotate-card">
        <div class="rotate-icon">📱↻</div>
        <p id="rotate-text"></p>
        <button id="btn-rotate-skip" onclick="document.getElementById('rotate-screen').style.display='none'">Play anyway</button>
      </div>
    </div>

    <!-- 首次引导 -->
    <div id="tutorial" class="hidden" data-tutorial>
      <div id="tut-card">
        <h3 id="tut-title"></h3>
        <p id="tut-text"></p>
        <div class="tut-btns">
          <button id="tut-skip" class="btn-ghost" data-tutorial-skip>Skip</button>
          <button id="tut-next">Got it</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
