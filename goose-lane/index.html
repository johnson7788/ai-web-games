<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="GOOSE LANE — a commuter goose on a three-lane metro run: dodge cars, grab gems, collect balloons, and stop at red gates across 12 stations.">
  <meta name="theme-color" content="#14122e">
  <title>GOOSE LANE · Metro Commute Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="ui-root"></div>
    <button id="btn-stop" class="touch-only" data-i18n="btn.stop" data-i18n-aria="btn.stop" hidden></button>
    <div id="rotate" class="rotate-hint" aria-hidden="true"><span class="rotate-icon">↻</span><span data-i18n="set.rotate">Rotate for the best view</span></div>
    <div id="loading" class="loading">
      <div class="loading-goose"></div>
      <span data-i18n="set.loading">Boarding…</span>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
