<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MINE EMPIRE</title>
  <meta name="description" content="Dig deeper, strike richer ore, and build a mining empire. An idle mining game with pickaxes, drills and refineries.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="hud-layer" class="hud-layer"></span>
        <span id="hud-depth"></span>
      </div>
      <div class="hud-right">
        <button id="btn-mute" class="hud-btn" aria-label="Sound"></button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
      </div>
    </div>

    <div id="panel" class="hidden">
      <div id="panel-money" class="panel-money"></div>
      <div id="panel-stats" class="panel-stats"></div>
      <div id="panel-layer" class="panel-layer"></div>
      <div class="panel-title">Upgrades</div>
      <button id="btn-pick" class="up-btn"><img class="up-icon" src="assets/icons/pickaxe.webp" alt=""><span class="up-text"><span class="up-name"></span><span class="up-desc"></span><span class="up-cost"></span></span></button>
      <button id="btn-drill" class="up-btn"><img class="up-icon" src="assets/icons/drill.webp" alt=""><span class="up-text"><span class="up-name"></span><span class="up-desc"></span><span class="up-cost"></span></span></button>
      <button id="btn-refinery" class="up-btn"><img class="up-icon" src="assets/icons/refinery.webp" alt=""><span class="up-text"><span class="up-name"></span><span class="up-desc"></span><span class="up-cost"></span></span></button>
    </div>

    <div id="screen-title" class="screen is-active">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <h1 id="title-text"></h1>
      <p class="subtitle" id="subtitle-text"></p>
      <p class="how-to" id="how-to"></p>
      <button id="btn-start"></button>
      <p class="best" id="title-best"></p>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume"></button>
      <button id="btn-reset" class="secondary"></button>
      <button id="btn-title" class="secondary"></button>
      <select id="lang-select-pause" class="lang-select" aria-label="Language"></select>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
